name: secret-scan

# Server-side backstop for the local pre-commit/pre-push hooks in ~/.githooks.
# The hooks can be bypassed with --no-verify; this cannot. Branch protection is
# unavailable on private repos on the free plan, so this is the safety net.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so a secret in an older commit is caught

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        # Picks up .gitleaks.toml from the repo root automatically.
        run: gitleaks git --redact --no-banner --exit-code 1 .
